  <link rel="stylesheet" href="./style.css">

  <title>Moisés Echeveste - Certificados</title>

  <style>
    /* ========================================
       CONFIGURAÇÃO GERAL
       ======================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 20px 0 30px;
    }


    /* ========================================
       CABEÇALHO
       ======================================== */

    header {
      width: 100%;
      text-align: center;
      overflow: hidden;
    }

    header img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
    }


    /* ========================================
       MOSAICO DE IMAGENS
       ======================================== */

    .image-mosaic {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin: 20px 0;
    }

    .image-mosaic a,
    .image-mosaic .diploma {
      width: 100%;
      display: block;
      text-decoration: none;
      margin: 0;
      padding: 0;
    }

    .image-mosaic img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }


    /* ========================================
       DIPLOMA
       ======================================== */

    .image-mosaic .diploma {
      width: 100%;
      display: block;
    }

    .image-mosaic .diploma img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }


    /* ========================================
       CELULAR
       ======================================== */

    @media (max-width: 600px) {

      main {
        width: 100%;
        padding: 10px;
      }

      h1 {
        font-size: 24px;
        text-align: center;
        margin: 15px 0 25px;
      }

      .image-mosaic {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin: 20px 0;
      }

      .image-mosaic a,
      .image-mosaic .diploma {
        width: 100%;
        max-width: 100%;
        display: block;
      }

      .image-mosaic img,
      .image-mosaic .diploma img {
        width: 100%;
        max-width: 100%;
        height: auto;
        display: block;
      }
    }


    /* ========================================
       TELAS MUITO PEQUENAS
       ======================================== */

    @media (max-width: 400px) {

      main {
        padding: 8px;
      }

      h1 {
        font-size: 21px;
      }

      .image-mosaic {
        gap: 15px;
      }

      .image-mosaic a,
      .image-mosaic .diploma {
        width: 100%;
      }

      .image-mosaic img,
      .image-mosaic .diploma img {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
