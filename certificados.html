<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./style.css">

  <title>Moisés Echeveste - Certificados</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
    }

    header {
      width: 100%;
      overflow: hidden;
    }

    header img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 20px 0 30px;
    }

    .image-mosaic {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .image-mosaic a {
      display: block;
      width: 100%;
      text-decoration: none;
    }

    .image-mosaic img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
    }

    /* DIPLOMA */
    .diploma {
      width: 100%;
      display: block;
    }

    .diploma img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* CELULAR */
    @media (max-width: 600px) {

      main {
        width: 100%;
        padding: 10px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 25px;
      }

      .image-mosaic {
        display: flex;
        flex-direction: column;
        width: 100%;
        gap: 20px;
      }

      .image-mosaic a,
      .diploma {
        width: 100%;
      }

      .image-mosaic img,
      .diploma img {
        width: 100%;
        height: auto;
      }
    }

    @media (max-width: 400px) {

      main {
        padding: 8px;
      }

      h1 {
        font-size: 21px;
      }

      .image-mosaic {
        gap: 15px;
      }
    }
  </style>
</head>
