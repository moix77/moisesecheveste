  <style>

    /* ==============================
       MOSAICO
       ============================== */

    .image-mosaic {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
      margin: 20px 0;
    }

    .image-mosaic a {
      display: block;
      width: 100%;
      text-decoration: none;
    }

    .image-mosaic img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }


    /* ==============================
       DIPLOMA
       ============================== */

    .diploma {
      width: 100%;
      display: block;
    }

    .diploma img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
    }


    /* ==============================
       CELULAR
       ============================== */

    @media (max-width: 600px) {

      main {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
      }

      h1 {
        font-size: 24px;
        text-align: center;
      }

      .image-mosaic {
        display: flex;
        flex-direction: column;
        width: 100%;
        gap: 20px;
      }

      .image-mosaic a,
      .diploma {
        width: 100%;
      }

      .image-mosaic img,
      .diploma img {
        width: 100%;
        height: auto;
      }
    }


    /* ==============================
       TELAS PEQUENAS
       ============================== */

    @media (max-width: 400px) {

      main {
        padding: 8px;
      }

      h1 {
        font-size: 21px;
      }

      .image-mosaic {
        gap: 15px;
      }

    }

  </style>

</head>
