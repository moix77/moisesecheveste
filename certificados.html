    <style>
      /* ==============================
         MOSAICO DE IMAGENS
         ============================== */

      .image-mosaic {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 15px;
        margin: 20px 0;
        width: 100%;
        box-sizing: border-box;
      }

      .image-mosaic a {
        width: calc(50% - 8px);
        margin-bottom: 10px;
        text-decoration: none;
        display: block;
        box-sizing: border-box;
      }

      .image-mosaic img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        max-width: 100%;
      }

      /* ==============================
         CELULAR
         ============================== */

      @media (max-width: 600px) {
        .image-mosaic {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 20px;
          margin: 20px 0;
          padding: 0;
          width: 100%;
        }

        .image-mosaic a {
          width: 100%;
          max-width: 100%;
          margin-bottom: 0;
        }

        .image-mosaic img {
          width: 100%;
          max-width: 100%;
          height: auto;
          display: block;
          object-fit: contain;
        }

        main {
          width: 100%;
          padding: 0 10px;
          box-sizing: border-box;
        }

        h1 {
          font-size: 24px;
          text-align: center;
          margin-bottom: 20px;
        }
      }

      /* ==============================
         TELAS MUITO PEQUENAS
         ============================== */

      @media (max-width: 400px) {
        main {
          padding: 0 8px;
        }

        h1 {
          font-size: 21px;
        }

        .image-mosaic {
          gap: 15px;
        }

        .image-mosaic a {
          width: 100%;
        }

        .image-mosaic img {
          width: 100%;
          height: auto;
        }
      }
    </style>
